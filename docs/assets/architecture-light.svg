<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Architecture: a caller authenticates with an Entra token; Easy Auth validates it; the broker function picks the vendor key by role, fetches it from Key Vault via managed identity, and injects it server-side into the vendor call. Only the response flows back. The key never leaves Azure.">
  <defs>
    <marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="alr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker>
  </defs>

  <rect x="184" y="44" width="452" height="300" rx="14" fill="#F0F8FE" stroke="#0078D4" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="204" y="68" font-size="13" font-weight="600" fill="#0078D4">Microsoft Azure — the key never leaves here</text>

  <rect x="24" y="150" width="132" height="72" rx="10" fill="#EEF2F7" stroke="#64748B" stroke-width="1.5"/>
  <text x="90" y="181" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">Caller</text>
  <text x="90" y="200" text-anchor="middle" font-size="11.5" fill="#475569">app · CI · dev</text>

  <rect x="210" y="150" width="120" height="72" rx="10" fill="#FFFFFF" stroke="#0078D4" stroke-width="1.5"/>
  <text x="270" y="181" text-anchor="middle" font-size="13" font-weight="600" fill="#0F172A">Easy Auth</text>
  <text x="270" y="199" text-anchor="middle" font-size="11" fill="#475569">validates JWT</text>

  <rect x="372" y="138" width="164" height="96" rx="12" fill="#0078D4" stroke="#005A9E" stroke-width="1.5"/>
  <text x="454" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Broker Function</text>
  <text x="454" y="192" text-anchor="middle" font-size="11" fill="#DCEEFB">pick key by role</text>
  <text x="454" y="208" text-anchor="middle" font-size="11" fill="#DCEEFB">scrub · inject</text>

  <rect x="372" y="270" width="164" height="56" rx="10" fill="#E0F2FE" stroke="#0369A1" stroke-width="1.5"/>
  <text x="454" y="293" text-anchor="middle" font-size="13" font-weight="600" fill="#0C4A6E">Key Vault</text>
  <text x="454" y="311" text-anchor="middle" font-size="10.5" fill="#0369A1">real vendor keys</text>

  <rect x="664" y="150" width="132" height="72" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
  <text x="730" y="181" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">Vendor API</text>
  <text x="730" y="200" text-anchor="middle" font-size="11.5" fill="#475569">gets the key</text>

  <line x1="156" y1="186" x2="208" y2="186" stroke="#475569" stroke-width="1.8" marker-end="url(#al)"/>
  <text x="182" y="177" text-anchor="middle" font-size="10.5" fill="#334155">token</text>
  <line x1="330" y1="186" x2="370" y2="186" stroke="#475569" stroke-width="1.8" marker-end="url(#al)"/>
  <line x1="454" y1="234" x2="454" y2="268" stroke="#475569" stroke-width="1.8" marker-end="url(#al)" marker-start="url(#al)"/>
  <text x="462" y="256" font-size="10" fill="#334155">managed identity</text>
  <line x1="536" y1="186" x2="662" y2="186" stroke="#475569" stroke-width="1.8" marker-end="url(#al)"/>
  <text x="599" y="177" text-anchor="middle" font-size="10.5" fill="#334155">key injected</text>
  <text x="599" y="205" text-anchor="middle" font-size="10.5" fill="#334155">server-side</text>

  <path d="M730,222 L730,352 L90,352 L90,224" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#alr)"/>
  <text x="410" y="347" text-anchor="middle" font-size="10.5" fill="#64748B">response — only the data flows back to the caller</text>
</svg>
