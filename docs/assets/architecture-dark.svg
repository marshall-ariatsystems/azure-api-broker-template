<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Architecture: a caller authenticates with an Entra token; Easy Auth validates it; the broker function picks the vendor key by role, fetches it from Key Vault via managed identity, and injects it server-side into the vendor call. Only the response flows back. The key never leaves Azure.">
  <defs>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker>
    <marker id="adr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
  </defs>

  <rect x="184" y="44" width="452" height="300" rx="14" fill="#0B2942" stroke="#3B9EFF" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="204" y="68" font-size="13" font-weight="600" fill="#5CB2FF">Microsoft Azure — the key never leaves here</text>

  <rect x="24" y="150" width="132" height="72" rx="10" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
  <text x="90" y="181" text-anchor="middle" font-size="14" font-weight="600" fill="#E2E8F0">Caller</text>
  <text x="90" y="200" text-anchor="middle" font-size="11.5" fill="#94A3B8">app · CI · dev</text>

  <rect x="210" y="150" width="120" height="72" rx="10" fill="#0F2A44" stroke="#3B9EFF" stroke-width="1.5"/>
  <text x="270" y="181" text-anchor="middle" font-size="13" font-weight="600" fill="#E2E8F0">Easy Auth</text>
  <text x="270" y="199" text-anchor="middle" font-size="11" fill="#94A3B8">validates JWT</text>

  <rect x="372" y="138" width="164" height="96" rx="12" fill="#1E88E5" stroke="#0B5FAF" stroke-width="1.5"/>
  <text x="454" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Broker Function</text>
  <text x="454" y="192" text-anchor="middle" font-size="11" fill="#DCEEFB">pick key by role</text>
  <text x="454" y="208" text-anchor="middle" font-size="11" fill="#DCEEFB">scrub · inject</text>

  <rect x="372" y="270" width="164" height="56" rx="10" fill="#0E2E4A" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="454" y="293" text-anchor="middle" font-size="13" font-weight="600" fill="#E0F2FE">Key Vault</text>
  <text x="454" y="311" text-anchor="middle" font-size="10.5" fill="#7DD3FC">real vendor keys</text>

  <rect x="664" y="150" width="132" height="72" rx="10" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
  <text x="730" y="181" text-anchor="middle" font-size="14" font-weight="600" fill="#E2E8F0">Vendor API</text>
  <text x="730" y="200" text-anchor="middle" font-size="11.5" fill="#94A3B8">gets the key</text>

  <line x1="156" y1="186" x2="208" y2="186" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#ad)"/>
  <text x="182" y="177" text-anchor="middle" font-size="10.5" fill="#CBD5E1">token</text>
  <line x1="330" y1="186" x2="370" y2="186" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#ad)"/>
  <line x1="454" y1="234" x2="454" y2="268" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#ad)" marker-start="url(#ad)"/>
  <text x="462" y="256" font-size="10" fill="#CBD5E1">managed identity</text>
  <line x1="536" y1="186" x2="662" y2="186" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#ad)"/>
  <text x="599" y="177" text-anchor="middle" font-size="10.5" fill="#CBD5E1">key injected</text>
  <text x="599" y="205" text-anchor="middle" font-size="10.5" fill="#CBD5E1">server-side</text>

  <path d="M730,222 L730,352 L90,352 L90,224" fill="none" stroke="#64748B" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#adr)"/>
  <text x="410" y="347" text-anchor="middle" font-size="10.5" fill="#94A3B8">response — only the data flows back to the caller</text>
</svg>
