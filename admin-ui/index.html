<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Connections and access</title>
<style>body{font:16px system-ui;margin:auto;max-width:960px;padding:2rem;background:#f7f8fa;color:#182230}section{background:white;border:1px solid #d8dee8;border-radius:8px;padding:1rem;margin:1rem 0}label,input,select,button{display:block;margin:.5rem 0}input,select{min-width:18rem;padding:.45rem}button{padding:.45rem .8rem}output{display:block;white-space:pre-wrap}small{color:#445}</style>
</head><body>
<main><h1>Connections and access</h1><p>Use this hosted administrator console to manage identity integrations, connections, and access.</p><output id="notice" aria-live="polite"></output>
<section><h2>Identity integrations</h2><form id="identity-form"><label>Display name <input name="displayName" required></label><label>Issuer <input name="issuer" type="url" required></label><label>Handoff <select name="handoffKind"><option value="marketplace">Marketplace</option><option value="private">Private</option><option value="generic">Generic</option></select></label><button>Add identity integration</button></form><output id="identities"></output></section>
<section><h2>Connections</h2><form id="connection-form"><label>Display name <input name="displayName" required></label><label>Provider <input name="provider" required></label><label>Credential <input name="credential" type="password" autocomplete="off"></label><p>This is a write-only credential. It is never shown after submission.</p><button>Create connection</button></form><output id="connections"></output></section>
<section><h2>Who can use this connection?</h2><form id="grant-form"><label>Connection ID <input name="connectionId" required></label><label>Kind <select name="kind"><option>user</option><option>group</option><option>workload</option></select></label><label>Subject <input name="subject" placeholder="group:ops" required></label><button>Grant access</button></form><output id="grants"></output></section>
<section><h2>Health, usage, and audit</h2><form id="observe-form"><label>Connection ID <input name="connectionId" required></label><button>Refresh</button></form><output id="observations"></output></section>
</main>
<script>
const byId=id=>document.getElementById(id); const say=message=>byId('notice').textContent=message;
async function api(path, options={}) { const r=await fetch(path,options); const body=await r.json(); if(!r.ok) throw Error(body.error||'Request failed'); return body; }
function show(id, value) { byId(id).textContent=JSON.stringify(value,null,2); }
async function refreshConnections(){show('connections',await api('/api/connections'));}
document.getElementById('identity-form').addEventListener('submit',async event=>{event.preventDefault();const form=event.currentTarget;try{const b=await api('/api/identity-integrations',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({kind:'generic-oidc',displayName:form.displayName.value,issuer:form.issuer.value,handoffKind:form.handoffKind.value})});show('identities',b);say('Identity integration saved.')}catch{say('Unable to save identity integration.')}});
document.getElementById('connection-form').addEventListener('submit',async event=>{event.preventDefault();const form=event.currentTarget;const credential=form.credential;try{const b=await api('/api/connections',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({displayName:form.displayName.value,provider:form.provider.value,credential:credential.value})});show('connections',b);say('Connection saved.');}catch{say('Unable to save connection.');}finally{credential.value='';}});
document.getElementById('grant-form').addEventListener('submit',async event=>{event.preventDefault();const f=event.currentTarget;try{const b=await api('/api/connections/'+encodeURIComponent(f.connectionId.value)+'/grants',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({kind:f.kind.value,subject:f.subject.value})});show('grants',b);say('Access granted.')}catch{say('Unable to grant access.')}});
document.getElementById('observe-form').addEventListener('submit',async event=>{event.preventDefault();const id=encodeURIComponent(event.currentTarget.connectionId.value);try{const b=await Promise.all(['health','usage','audit'].map(x=>api('/api/connections/'+id+'/'+x)));show('observations',b);say('Observations refreshed.')}catch{say('Unable to refresh observations.')}});
refreshConnections().catch(()=>say('Connections are unavailable.'));
</script></body></html>
