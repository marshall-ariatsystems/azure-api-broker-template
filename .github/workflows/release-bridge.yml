name: release broker bridge

on:
  push:
    tags:
      - 'bridge-v*'
  workflow_dispatch:

# Build jobs only need source read access. Release publication and provenance permissions are
# granted to the release job below, after all platform builds have passed.
permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            executable: broker-bridge
          - os: macos-14
            rid: osx-arm64
            executable: broker-bridge
            expected_arch: arm64
          - os: windows-latest
            rid: win-x64
            executable: broker-bridge.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/bridge/package-lock.json

      - name: Guard bridge version consistency
        shell: bash
        run: |
          set -euo pipefail
          package_version=$(node -p "require('./clients/bridge/package.json').version")
          bridge_version=$(grep -E "BRIDGE_VERSION" clients/bridge/version.mjs | head -n 1 | sed -E "s/.*['\"]([^'\"]+)['\"].*/\1/")
          tag_version='(not a push)'
          if [ "$GITHUB_EVENT_NAME" = 'push' ]; then
            tag_version="${GITHUB_REF_NAME#bridge-v}"
          fi
          printf 'tag version: %s\npackage version: %s\nBRIDGE_VERSION: %s\n' "$tag_version" "$package_version" "$bridge_version"
          if [ "$GITHUB_EVENT_NAME" = 'push' ] && [ "$tag_version" != "$package_version" ]; then
            exit 1
          fi
          test "$package_version" = "$bridge_version"

      - name: Install dependencies
        shell: bash
        working-directory: clients/bridge
        run: npm ci

      - name: Run tests
        shell: bash
        working-directory: clients/bridge
        run: npm test

      - name: Bundle bridge
        shell: bash
        working-directory: clients/bridge
        run: npm run bundle

      - name: Package bridge
        shell: bash
        working-directory: clients/bridge
        run: npm run package

      - name: Assert packaged architecture
        if: matrix.expected_arch
        shell: bash
        working-directory: clients/bridge
        run: |
          set -euo pipefail
          file dist/broker-bridge | grep -Eiq "${{ matrix.expected_arch }}|arm64e"

      - name: Smoke test packaged bridge
        shell: bash
        working-directory: clients/bridge
        run: node --test test/packaged.test.mjs

      # To sign Windows artifacts, configure these repository secrets with a base64 PFX and its
      # password. Signing remains deliberately optional so forks can still build release candidates.
      - name: Sign Windows executable when certificate secrets are configured
        if: runner.os == 'Windows'
        shell: bash
        env:
          WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          if [ -z "$WINDOWS_SIGNING_CERTIFICATE" ] || [ -z "$WINDOWS_SIGNING_PASSWORD" ]; then
            echo 'Windows signing secrets are not configured; leaving release candidate unsigned.'
            exit 0
          fi
          certificatePath="$RUNNER_TEMP/broker-bridge-signing.pfx"
          printf '%s' "$WINDOWS_SIGNING_CERTIFICATE" | base64 --decode > "$certificatePath"
          trap 'rm -f "$certificatePath"' EXIT
          signtool.exe sign /fd SHA256 /f "$certificatePath" /p "$WINDOWS_SIGNING_PASSWORD" 'clients/bridge/dist/broker-bridge.exe'

      - name: Rename distribution binary
        shell: bash
        working-directory: clients/bridge
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          extension=''
          if [ "${{ runner.os }}" = 'Windows' ]; then
            extension='.exe'
          fi
          mv "dist/broker-bridge${extension}" "dist/broker-bridge-${version}-${{ matrix.rid }}${extension}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: broker-bridge-${{ matrix.rid }}
          path: clients/bridge/dist/broker-bridge-*-${{ matrix.rid }}*
          if-no-files-found: error

  release:
    name: attest and publish
    if: github.event_name == 'push'
    needs: [build, verify-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums and dependency SBOM
        shell: bash
        run: |
          set -euo pipefail
          cp LICENSE dist/broker-bridge-LICENSE.txt
          cp clients/bridge/README.md dist/broker-bridge-README.md
          (cd dist && sha256sum broker-bridge-* > SHA256SUMS)
          (cd clients/bridge && npm ci --omit dev --ignore-scripts >/dev/null)
          (cd clients/bridge && npm sbom --sbom-format cyclonedx --omit dev) > dist/broker-bridge.cdx.json

      - name: Generate build provenance
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: 'dist/broker-bridge-*'

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --generate-notes --title "Broker bridge $TAG"

  verify-integration:
    name: release integration verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            clients/bridge/package-lock.json
            function-node/package-lock.json
      - name: Install and test bridge and Function surfaces
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix clients/bridge
          npm ci --prefix function-node
          npm test --prefix clients/bridge
          npm test --prefix function-node
      - name: Test Node and Python client integration surfaces
        shell: bash
        run: |
          set -euo pipefail
          node --test clients/node/test/*.test.mjs
          python3 -m unittest clients.test_broker_config clients.test_broker_preflight clients.test_broker_client_integration
